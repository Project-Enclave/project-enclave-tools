[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-enclave-tools"
version = "0.1.1"
description = "Tools made mainly to help the devs of project enclave and other sub projects under it"
authors = [{name = "Pradhya", email = "Pradhya@projectenclave.dev"}]
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.urls]
Repository = "https://github.com/Chinglen2080/dev-tools"
Issues = "https://github.com/Chinglen2080/dev-tools/issues"

[project.scripts]
tools = "dev_tools.cli:main"
