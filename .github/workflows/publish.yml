name: Publish to PyPI

on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install the project and development tools
        run: |
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt

      - name: Run project checks
        run: tools check

      - name: Check the trusted release key fingerprint
        env:
          TRUSTED_KEY_FINGERPRINT: "SHA256:06:4C:C1:B3:3E:36:A8:12:6A:D7:56:15:28:83:E5:59:39:07:C0:A4:A3:2F:00:4E:F0:F6:5D:D2:E9:A8:E0:43"
        run: |
          actual="$(tools sign --fingerprint --public-key .github/release-public.pem)"
          test "$actual" = "$TRUSTED_KEY_FINGERPRINT"

      - name: Verify the signed manifest
        run: tools sign --verify --public-key .github/release-public.pem

  build:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Build and validate distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Save distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/project-enclave-tools/
    permissions:
      id-token: write
    steps:
      - name: Retrieve distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
